name: Jaga Supabase tetap aktif

on:
  schedule:
    # Setiap Senin jam 02:00 UTC (~09:00 WIB) -- sekali seminggu sudah cukup untuk mencegah
    # project Supabase di-pause otomatis karena dianggap tidak terpakai.
    - cron: '0 2 * * 1'
  workflow_dispatch: {}
    # ^ ini bikin ada tombol "Run workflow" manual di tab Actions GitHub, buat coba tanpa
    #   perlu nunggu jadwal mingguan.

jobs:
